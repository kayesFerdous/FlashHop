# Every push/PR: lint, test, and build all three apps (downloadable as workflow artifacts).
# Push a tag like v0.2.0: same, then publish a GitHub Release with the files attached.
# Asset names have no version so README links to releases/latest/download/<name> never break.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - run: android/setup-tools.sh
      # Optional stable release key. Without these secrets each build is signed with a throwaway
      # debug key, and phones must uninstall the old version before installing a new one.
      - name: Signing key
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FLASHHOP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: android/build.sh
        env:
          FLASHHOP_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLASHHOP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: mv android/flashhop.apk flashhop-android.apk
      - uses: actions/upload-artifact@v7
        with: { name: android, path: flashhop-android.apk }

  linux:
    runs-on: ubuntu-22.04 # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release -p flashhop
      # The icon (same rasterizer as the window icon) lets install.sh add an app-menu entry.
      - run: ICON_PNG="$PWD/flashhop.png" cargo test --release -p flashhop icon
      - run: tar -czf flashhop-linux-x86_64.tar.gz -C target/release flashhop -C "$PWD" flashhop.png
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: flashhop-linux-x86_64.tar.gz }

  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    env:
      RUSTFLAGS: -C target-feature=+crt-static # no VC++ runtime needed on the user's machine
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release -p flashhop
      # .ico for the Start menu shortcut install.ps1 creates (same rasterizer as the window icon).
      - run: ICON_ICO="$PWD/flashhop.ico" cargo test --release -p flashhop icon
      - run: cp target/release/flashhop.exe . && 7z a flashhop-windows-x86_64.zip flashhop.exe flashhop.ico
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: flashhop-windows-x86_64.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          cargo build --release -p flashhop --target aarch64-apple-darwin
          cargo build --release -p flashhop --target x86_64-apple-darwin
      - name: Universal .app bundle
        run: |
          VERSION=$(grep -m1 '^version' desktop/Cargo.toml | cut -d'"' -f2)
          APP="FlashHop.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/flashhop" \
            target/aarch64-apple-darwin/release/flashhop target/x86_64-apple-darwin/release/flashhop
          # Icon: the same rasterizer as the window icon (ui::app_icon) writes a 1024 px PNG.
          ICON_PNG="$PWD/icon.png" cargo test --release -p flashhop --target aarch64-apple-darwin icon
          mkdir -p icon.iconset "$APP/Contents/Resources"
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s * 2)) $((s * 2)) icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>FlashHop</string>
            <key>CFBundleIdentifier</key><string>app.flashhop</string>
            <key>CFBundleExecutable</key><string>flashhop</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>Finds your other devices and sends files to them over this network.</string>
          </dict></plist>
          EOF
          codesign --force --deep -s - "$APP"   # ad-hoc: no Apple developer account needed
          ditto -c -k --keepParent "$APP" flashhop-macos.zip
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: flashhop-macos.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cat > notes.md <<'EOF'
          ## Download

          | Device | File | First run |
          |---|---|---|
          | Android 11+ | `flashhop-android.apk` | Open it on the phone and allow "install unknown apps" when asked. |
          | macOS 11+ (Intel and Apple Silicon) | `flashhop-macos.zip` | Unzip and move to Applications. On first open, macOS blocks it because it is unsigned: go to System Settings → Privacy & Security → **Open Anyway**. |
          | Windows 10/11 x64 | `flashhop-windows-x86_64.zip` | In PowerShell: `irm https://raw.githubusercontent.com/kayesFerdous/FlashHop/main/install.ps1 \| iex`, or unzip and run `flashhop.exe`. Click **Allow** when Windows Firewall asks. |
          | Linux x86_64 | `flashhop-linux-x86_64.tar.gz` | `curl -fsSL https://raw.githubusercontent.com/kayesFerdous/FlashHop/main/install.sh \| sh`, or `tar xzf flashhop-linux-x86_64.tar.gz && ./flashhop` |

          All devices must be on the same Wi-Fi/router. Port 47821 (UDP + TCP) must not be blocked by a firewall.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "FlashHop $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
